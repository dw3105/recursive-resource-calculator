[estate]
release = "7e16fee1bf67ab0dec8e743f643f1638f242046f"
template = "ae2a0aa00ebacea759031b83f6a38c870da04821350cef61a2d64a32cf4d234a"

[lane]
task_dir = "docs/tasks"
claimed_numbers = "docs/tasks/CLAIMED_NUMBERS.md"
prefix = ""
audit_dir = "docs/audit/runs"
engine = "codex exec"
label = "rrc/agent"
weight_mib = 1024
weight_cores = 0.5
suite_label = "rrc/heavy"

[verify]
#lane_gate._run_verifier substitutes {tag} and {worktree} only, so a {tests} placeholder reaches bash unexpanded
#and the verifier runs "lua5.2 {tests}", which fails for a reason that has nothing to do with the lane.
default = "gateslot --label rrc/heavy --no-autostart -- sh tests/run.sh"
scaffold = "sh tests/run.sh"
