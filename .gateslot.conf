# Lane pricing for dw3105/recursive-resource-calculator, round 8.
# gateslot walks up from the lane's working directory; a ~/wt-rrc-* worktree
# contains this file because it is checked in, so lanes never fall through to
# fail-heavy (which would serialise six lanes meant to run together).
unknown-label = refuse
# One codex lane: the agent process plus a ~17 s two-interpreter Lua suite.
weight.rrc/agent = mib=1024 cores=0.5
weight.rrc/heavy = mib=1024 cores=0.5
# Plan §3: six coders at a time on a 4-core host shared with other estate work.
max.rrc/agent = 6
max.rrc/heavy = 3
